<svg width="144" height="144" viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角背景 -->
  <rect width="144" height="144" rx="32" ry="32" fill="url(#bgGradient)"/>
  
  <!-- 书本主体 -->
  <g transform="translate(24, 32)">
    <!-- 书本背景 -->
    <rect x="8" y="8" width="80" height="64" rx="4" ry="4" fill="url(#bookGradient)" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- 书本装订线 -->
    <line x1="12" y1="12" x2="12" y2="68" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- 文字行（代表单词） -->
    <rect x="20" y="20" width="32" height="3" rx="1.5" fill="#64748b"/>
    <rect x="20" y="28" width="28" height="3" rx="1.5" fill="#64748b"/>
    <rect x="20" y="36" width="35" height="3" rx="1.5" fill="#64748b"/>
    <rect x="20" y="44" width="25" height="3" rx="1.5" fill="#64748b"/>
    
    <!-- 高亮单词（重点单词） -->
    <rect x="20" y="52" width="30" height="4" rx="2" fill="#3b82f6"/>
    <rect x="20" y="60" width="24" height="4" rx="2" fill="#3b82f6"/>
  </g>
  
  <!-- AI 神经网络图标 -->
  <g transform="translate(72, 24)">
    <!-- 神经元节点 -->
    <circle cx="8" cy="12" r="3" fill="url(#aiGradient)"/>
    <circle cx="24" cy="6" r="3" fill="url(#aiGradient)"/>
    <circle cx="24" cy="18" r="3" fill="url(#aiGradient)"/>
    <circle cx="40" cy="12" r="3" fill="url(#aiGradient)"/>
    
    <!-- 连接线 -->
    <line x1="11" y1="12" x2="21" y2="6" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
    <line x1="11" y1="12" x2="21" y2="18" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
    <line x1="27" y1="6" x2="37" y2="12" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
    <line x1="27" y1="18" x2="37" y2="12" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
  </g>
  
  <!-- 论文图标 -->
  <g transform="translate(96, 64)">
    <rect x="0" y="0" width="20" height="24" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="3" y="4" width="14" height="2" rx="1" fill="#94a3b8"/>
    <rect x="3" y="8" width="10" height="1.5" rx="0.75" fill="#cbd5e1"/>
    <rect x="3" y="12" width="12" height="1.5" rx="0.75" fill="#cbd5e1"/>
    <rect x="3" y="16" width="8" height="1.5" rx="0.75" fill="#cbd5e1"/>
  </g>
  
  <!-- 学习进度指示器 -->
  <g transform="translate(28, 108)">
    <rect x="0" y="0" width="88" height="6" rx="3" fill="#e2e8f0"/>
    <rect x="0" y="0" width="52" height="6" rx="3" fill="#10b981"/>
    
    <!-- 进度百分比 -->
    <text x="44" y="16" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#374151" text-anchor="middle">60%</text>
  </g>
  
  <!-- 标签/徽章 -->
  <g transform="translate(8, 8)">
    <rect x="0" y="0" width="24" height="12" rx="6" fill="#ef4444"/>
    <text x="12" y="8" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle">AI</text>
  </g>
</svg>